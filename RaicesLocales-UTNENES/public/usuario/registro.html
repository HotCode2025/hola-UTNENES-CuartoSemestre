<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header class="navbar">
        <a class="logo" href="../index.html">Raíces Locales</a>
        <nav aria-label="Navegación de usuario">
            <a href="../index.html">Inicio</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main>
        <h1>Crear cuenta</h1>
        <form id="form-registro">
            <p><label for="nombre">Nombre</label><input id="nombre" name="nombre" autocomplete="given-name" required minlength="2" maxlength="80"></p>
            <p><label for="apellido">Apellido</label><input id="apellido" name="apellido" autocomplete="family-name" required minlength="2" maxlength="80"></p>
            <p><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254"></p>
            <p><label for="password">Contraseña (mínimo 8 caracteres)</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></p>
            <button id="btnRegistrar" type="submit">Registrarme</button>
            <p id="mensaje" role="alert"></p>
        </form>
        <p>¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
    </main>

    <script src="../js/usuario/api.js"></script>
    <script src="../js/usuario/registro.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header class="navbar">
        <a class="logo" href="../index.html">Raíces Locales</a>
        <nav aria-label="Navegación de usuario">
            <a href="../index.html">Inicio</a>
            <a href="registro.html">Registrarme</a>
        </nav>
    </header>

    <main>
        <h1>Iniciar sesión</h1>
        <form id="form-login">
            <p><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></p>
            <p><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></p>
            <button id="btnLogin" type="submit">Ingresar</button>
            <p id="mensaje" role="alert"></p>
        </form>
        <p>¿No tienes cuenta? <a href="registro.html">Registrarme</a></p>
    </main>

    <script src="../js/usuario/api.js"></script>
    <script src="../js/usuario/login.js"></script>

</body>

</html>

spring.application.name=estudiantes

# Conexion H2 (base de datos embebida en archivo: ./data/estudiantes.mv.db)
spring.datasource.url=jdbc:h2:file:./data/estudiantes
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Conexion MySQL (como en el video) - descomentar y comentar H2 para usarla
#spring.datasource.url=jdbc:mysql://localhost:3306/estudiantes
#spring.datasource.username=root
#spring.datasource.password=admin
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Con H2 dejamos que Hibernate cree la tabla (con MySQL el profe usa none)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Carga los estudiantes de ejemplo (data.sql) despues de crear la tabla
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Desactivar el tomcat (aplicacion de consola)
spring.main.web-application-type=none

# Consola limpia: solo el mensaje (sin fecha ni nivel), como se ve en el video
logging.pattern.console=%msg%n
spring.main.banner-mode=console

# Puerto del servidor (opcional, por defecto es 8080)
server.port=8080

# Conexión a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/estudiantes_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=tu_usuario
spring.datasource.password=tu_contraseña
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate/JPA
# update: actualiza el esquema automáticamente si hay cambios en la entidad Estudiante
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true